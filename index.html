<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geothermal KPI Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Source+Serif+4:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#overview" aria-label="Geothermal KPI Dashboard home">
      <span class="brand-mark" aria-hidden="true">GT</span>
      <span class="brand-name">Geothermal<br>KPI Dashboard</span>
    </a>
    <!-- Nav links are generated from the tab registry in js/app.js -->
    <nav id="tab-nav" class="tab-nav" aria-label="Dashboard sections" role="tablist"></nav>
  </header>

  <main id="tab-panels" class="tab-panels"></main>

  <footer class="site-footer">
    <p>Geothermal KPI Dashboard. Data sources are listed on each tab.</p>
  </footer>

  <!-- Plotly for charts -->
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="js/chart-theme.js"></script>

  <!-- 1. Core: tab registry + router (must load first) -->
  <script src="js/app.js"></script>

  <!-- 2. Tabs: one file per tab. Order here = order in the nav bar. -->
  <script src="js/tabs/technical/plant-map.js"></script>
  <script src="js/tabs/technical/cost-focus.js"></script>
  <script src="js/tabs/overview.js"></script>
  <script src="js/tabs/technical-kpis.js"></script>
  <script src="js/tabs/industry-comparison.js"></script>
  <script src="js/tabs/project-map.js"></script>
  <script src="js/tabs/financial-kpis.js"></script>
  <script src="js/tabs/financial/kpi-trends.js"></script>
  <script src="js/tabs/financial/capital-stack.js"></script>


  <!-- 3. Start the dashboard (must load last) -->
  <script>Dashboard.start();</script>
</body>
</html>
